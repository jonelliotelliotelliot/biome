<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }

  /* control panel: quiet frosted glass, ink text, hairlines, iOS-style sliders and switches */
  .lil-gui {   /* (lil-gui re-declares its variables on every folder, so set them on all of them) */
    --ink: 31, 28, 28;
    --background-color: rgba(255, 255, 255, .74);
    --text-color: rgb(var(--ink));
    --title-background-color: transparent;
    --title-text-color: rgb(var(--ink));
    --widget-color: rgba(var(--ink), .05);
    --hover-color: rgba(var(--ink), .08);
    --focus-color: rgba(var(--ink), .1);
    --number-color: rgba(var(--ink), .55);
    --string-color: rgba(var(--ink), .55);
    --font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
    --font-size: 11.5px;
    --input-font-size: 11.5px;
    --padding: 6px;
    --spacing: 6px;
    --widget-height: 24px;
    --title-height: 34px;
    --widget-border-radius: 8px;
    --name-width: 40%;
    --slider-input-width: 30px;
    --folder-indent: 0px;
    -webkit-font-smoothing: antialiased;
  }
  .lil-gui .lil-gui { --background-color: transparent; }
  .lil-gui.root {
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 0.5px solid rgba(var(--ink), .1);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(var(--ink), .08), 0 2px 6px rgba(var(--ink), .04);
    top: 16px !important; right: 16px !important; width: 248px;
  }
  .lil-gui.root > .children { padding: 0 6px 6px; max-height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: none; }
  .lil-gui.root > .children::-webkit-scrollbar { display: none; }

  /* titles: the panel's name, then small tracked section labels with a fine chevron */
  .lil-gui .title { display: flex; align-items: center; gap: 8px; padding: 0 10px; }
  .lil-gui .title::before { content: '' !important; flex: none; width: 5px; height: 5px; margin: 0 2px 2px 1px;
    border: solid rgba(var(--ink), .35); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform .2s ease; }
  .lil-gui.closed > .title::before { transform: rotate(-45deg); margin: 0 3px 0 0; }
  .lil-gui.root > .title { font-size: 13px; font-weight: 600; letter-spacing: -.01em; height: 44px; }
  .lil-gui .lil-gui > .title { border: 0; height: 32px; font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: rgba(var(--ink), .45); }
  .lil-gui .lil-gui { border-top: 0.5px solid rgba(var(--ink), .08) !important; }
  .lil-gui .lil-gui .lil-gui > .title { letter-spacing: .06em; padding-left: 14px; }
  .lil-gui .title:hover { background: none; color: rgb(var(--ink)); }
  .lil-gui .lil-gui > .children { padding-bottom: 6px; }

  /* rows */
  .lil-gui .controller { padding: 0 4px; margin: 2px 0; }
  .lil-gui .controller .name { color: rgba(var(--ink), .62); }
  .lil-gui input { font-variant-numeric: tabular-nums; }

  /* sliders: a fine track, an ink fill, a white knob; the value sits quietly to the right */
  .lil-gui .controller.number .slider { background: none !important; overflow: visible; margin-right: 10px; position: relative; }
  .lil-gui .controller.number .slider::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px;
    border-radius: 3px; background: rgba(var(--ink), .1); }
  .lil-gui .controller.number .slider .fill { position: absolute; left: 0; top: 50%; height: 3px; margin-top: -1.5px; border: 0; border-radius: 3px;
    background: rgba(var(--ink), .78); }
  .lil-gui .controller.number .slider .fill::after { content: ''; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(var(--ink), .22), 0 0 0 .5px rgba(var(--ink), .12); transition: transform .15s ease; }
  .lil-gui .controller.number .slider:hover .fill::after, .lil-gui .controller.number.active .slider .fill::after { transform: scale(1.15); }
  .lil-gui .controller.number input { background: none !important; padding: 0; text-align: right; color: rgba(var(--ink), .55); }
  .lil-gui .controller.number input:focus { color: rgb(var(--ink)); box-shadow: none; }

  /* buttons: soft pills, the shortcut as a small key on the right */
  .lil-gui .controller.function button { height: 30px; padding: 0 10px; border-radius: 10px; background: rgba(var(--ink), .045);
    font-weight: 500; color: rgb(var(--ink)); transition: background .15s ease; }
  .lil-gui .controller.function button:hover { background: rgba(var(--ink), .08); }
  .lil-gui .controller.function button:active { background: rgba(var(--ink), .12); }
  .lil-gui .controller.function button .name { display: flex; justify-content: space-between; align-items: center; color: inherit; }
  .lil-gui kbd { font: 500 9.5px/1 var(--font-family); color: rgba(var(--ink), .45); padding: 3px 5px; border-radius: 5px;
    background: rgba(255, 255, 255, .8); box-shadow: 0 0 0 .5px rgba(var(--ink), .14), 0 1px 0 rgba(var(--ink), .08); }

  /* dropdowns: just the value and a small chevron */
  .lil-gui .controller.option .display { margin-left: auto; background: none !important; padding-right: 16px; text-align: right; color: rgb(var(--ink)); font-weight: 500; }
  .lil-gui .controller.option .display::after { content: '' !important; position: absolute; right: 4px; top: 50%; width: 4px; height: 4px; margin-top: -4px;
    border: solid rgba(var(--ink), .4); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }

  /* switches */
  .lil-gui .controller.boolean input { appearance: none; -webkit-appearance: none; position: relative; width: 28px; height: 17px; margin: 0;
    border-radius: 9px; background: rgba(var(--ink), .14); transition: background .2s ease; }
  .lil-gui .controller.boolean input::before { content: '' !important; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(var(--ink), .25); transition: transform .2s cubic-bezier(.3, 1.3, .5, 1); }
  .lil-gui .controller.boolean input:checked { background: rgba(var(--ink), .78); }
  .lil-gui .controller.boolean input:checked::before { transform: translateX(11px); }

  /* colour swatches and text fields */
  .lil-gui .controller.color .display { border-radius: 7px; box-shadow: inset 0 0 0 .5px rgba(var(--ink), .15); }
  .lil-gui .controller.string input { border-radius: 8px; }
</style>
</head>
<body>
</div>

<!-- saved colour palettes (written from the Colours panel); fine if it's missing -->
<script src="palettes.js"></script>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
} }
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
