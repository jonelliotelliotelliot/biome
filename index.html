<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

const V3 = THREE.Vector3, TAU = Math.PI * 2, UP = new V3(0, 1, 0);
const clamp01 = (x) => Math.min(1, Math.max(0, x)), clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// ───────────────────────── tunables
const STEM_SAMPLES = 48;          // rest points along each stem curve
const STEM_RINGS = 40;            // tube rings per stem (smooth when zoomed right in)
const STEM_SIDES = 10;
const GROW_TIME = 1.5;            // seconds for a ~3-unit main stem to reach full height
const SWAY_AMP = 0.022;           // idle sway, as a fraction of stem length
const SWAY_K = 18, SWAY_D = 2.6;  // stem spring stiffness / damping (underdamped = wobbly)
const POP_K = 170, POP_D = 11;    // springy pop-in for leaves and flowers
const BLOOM_K = 38, BLOOM_D = 5.5;// flower opening spring
const EXIT_TIME = 0.32;           // old plant sinks away this fast
const MAX_PARTICLES = 400;

const params = {
  species: 'buttercup', seed: 0, stems: 4, height: 1, branching: 0.6, leafiness: 0.6, bloom: 0.65,
  wind: 0.35,   // 0 = still air, 1 = blustery
  butterflies: 2,
  crawlers: 3,
  ladybugs: 4,
  flies: 7,
  spiders: 5,
  ants: 24,
  rain: 0.4,    // how often showers come (0 = never)
  hairs: true,   // fine hairs on the stems, shown when zoomed right in
  dof: true,     // macro focus: zoomed right in, the background goes soft
  ambience: 0.7, // volume of the birds / crickets / frogs (0 = off)
  critters: 0.6, // volume of the up-close critter sounds (0 = off)
};
{
  const h = parseInt(location.hash.replace(/^#[a-z]+-/, '#').slice(1), 10);
  params.seed = Number.isFinite(h) ? h : Math.floor(Math.random() * 100000);
}

// ───────────────────────── species: a few shape knobs (mint has its own build). Pick one in the panel; #alien-123 in the URL works too
const SPECIES = {
  buttercup: {
    petals: [5, 5],        // petal count range (one count per plant)
    petalLen: 0.2, petalW: 0.44, petalCup: 0.14, petalOpen: 0.16, // open = petal angle above horizontal (rad)
    centerR: 0.34, sepalLen: 0.5,
    wiggle: 0.05, waves: 1, nod: 0.07, beads: 0, // stem S-bend, how many bends, nodding head, knobbly nodes
    leafW: [0.17, 0.25], leafRound: 0.78,         // leaf width (fraction of length), tip roundness
    centerH: 0.12, stemR: 1, flowerScale: 1, leafScale: 1,   // centre dome height, size multipliers
  },
  mint: {   // a whole different build: see buildMint
    structure: 'mint',
    petals: [5, 5], petalLen: 0.2, petalW: 0.44, petalCup: 0.14, petalOpen: 0.16, centerR: 0.34, sepalLen: 0.5,
    wiggle: 0.03, waves: 1, nod: 0, beads: 0,
    leafW: [0.36, 0.44], leafRound: 0.55,                        // broad ovals with softly rounded tips
    centerH: 0.12, stemR: 1, flowerScale: 1, leafScale: 1,
  },
  alien: {
    petals: [3, 7],
    petalLen: 0.3, petalW: 0.2, petalCup: -0.55, petalOpen: 0.5, // long straps that curl back like tentacles
    centerR: 0.5, sepalLen: 0.8,
    wiggle: 0.08, waves: 2.5, nod: 0.2, beads: 0.9,
    leafW: [0.42, 0.55], leafRound: 1,                           // spoon-shaped paddles
    centerH: 0.12, stemR: 1, flowerScale: 1, leafScale: 1,
  },
};
const hashMatch = location.hash.match(/^#(?:([a-z]+)-)?(\d+)$/);
const DEFAULT_SPECIES = 'buttercup';   // the one a plain #seed URL means
params.species = SPECIES[hashMatch?.[1]] ? hashMatch[1] : DEFAULT_SPECIES;
let SP = SPECIES[params.species];

// palette: "sunset", for every species (raw hex → shader values, no colour conversion)
const SUNSET = { petalTip: '#ff7c5c', petalBase: '#f0c838', center: '#976d6d', stemBase: '#3a4739', stemTip: '#5ca3c1',
  leafBase: '#503516', leafTip: '#367d58', sky: '#ffffff' };
const raw = (hex) => { const n = parseInt(hex.slice(1), 16); return new V3((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); };
const PAL = { ...SUNSET };
const U = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, { value: raw(v) }]));

// ───────────────────────── renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 300);
camera.position.set(2.6, 2.3, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
// orbit around the plant's middle; the target eases to each new plant until you pan away
controls.screenSpacePanning = true;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.4;
controls.maxDistance = 16;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = Math.PI - 0.05;
const CAM_MIN_Y = 0.03;   // the camera (and what it orbits) never goes below this: orbiting stops at the ground (see frame)
const camTarget = new V3(0, 1.55, 0);
controls.target.copy(camTarget);
let fitDist = 0;                           // >0 while easing the zoom to frame a new plant
controls.addEventListener('start', () => { fitDist = 0; }); // the user's own zoom wins
function frameDistance(radius) {
  const vf = camera.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return radius * 0.78 / Math.sin(Math.min(vf, hf)); // a little tighter than a full fit
}

// ───────────────────────── grain (screen-space paper texture on every material)
const GRAIN = { value: 0.095 };
const SH_F = 'uniform float uGrain;\nfloat grainHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }\n';
const BEND = 'gl_Position = projectionMatrix * viewMatrix * wp;';
const GRAIN_F = 'gl_FragColor.rgb += (grainHash(gl_FragCoord.xy) - 0.5) * uGrain;';
const shaderMat = (uniforms, vs, fs, extra = {}) => new THREE.ShaderMaterial({
  uniforms: { uGrain: GRAIN, ...uniforms }, vertexShader: vs, fragmentShader: SH_F + fs, ...extra,
});

// ───────────────────────── ground: flat and invisible, it only catches a soft grainy shadow
const sun = new THREE.DirectionalLight(0xffffff, 1);   // the only light; it exists to cast shadows
sun.position.set(2.5, 9, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 1, far: 25 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.12 });
shadowMat.onBeforeCompile = (sh) => {
  sh.uniforms.uGrain = GRAIN;
  sh.fragmentShader = SH_F + sh.fragmentShader.replace('#include <fog_fragment>',
    '#include <fog_fragment>\ngl_FragColor.a *= 1.0 + (grainHash(gl_FragCoord.xy) - 0.5) * uGrain * 7.0;');
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), shadowMat);
ground.receiveShadow = true;
scene.add(ground);

const UV_VS = `varying vec2 vUv;
void main() { vUv = uv; vec4 wp = modelMatrix * vec4(position, 1.0); ${BEND} }`;

// stems: plain base→tip gradient
const STEM_VS = `attribute float aT; varying float vT;
void main() { vT = aT; vec4 wp = modelMatrix * vec4(position, 1.0); ${BEND} }`;
const STEM_FS = `uniform vec3 uBase; uniform vec3 uTip; varying float vT;
void main() {
  vec3 c = mix(uBase, uTip, smoothstep(0.0, 1.0, vT));
  gl_FragColor = vec4(c, 1.0);
  ${GRAIN_F}
}`;

// leaves + sepals: base→tip gradient, crisp two-tone fold down the midrib
const LEAF_FS = `uniform vec3 uBase; uniform vec3 uTip; varying vec2 vUv;
void main() {
  vec3 c = mix(uBase, uTip, smoothstep(0.0, 1.0, vUv.x));
  float aa = fwidth(vUv.y) * 0.75;
  c = mix(c, c * 1.12 + 0.025, smoothstep(-aa, aa, vUv.y));
  if (!gl_FrontFacing) c *= 0.84;
  gl_FragColor = vec4(c, 1.0);
  ${GRAIN_F}
}`;

// petals: warm claw → butter tip
const PETAL_FS = `uniform vec3 uBase; uniform vec3 uTip; varying vec2 vUv;
void main() {
  vec3 c = mix(uBase, uTip, smoothstep(0.0, 0.7, vUv.x));
  if (!gl_FrontFacing) c = mix(c, uBase, 0.4) * 0.95;
  gl_FragColor = vec4(c, 1.0);
  ${GRAIN_F}
}`;

// flower centre: a crisp green disc on a warm ring
const CENTER_FS = `uniform vec3 uCenter; uniform vec3 uRing; varying vec2 vUv;
void main() {
  float r = length(vUv), ra = fwidth(r);
  vec3 c = mix(uCenter, uRing, smoothstep(-ra, ra, r - 0.5));
  gl_FragColor = vec4(c, 1.0);
  ${GRAIN_F}
}`;

const MAT = {
  stem: shaderMat({ uBase: U.stemBase, uTip: U.stemTip }, STEM_VS, STEM_FS),
  receptacle: shaderMat({ uBase: U.leafTip, uTip: U.leafTip }, STEM_VS, STEM_FS),
  leaf: shaderMat({ uBase: U.leafBase, uTip: U.leafTip }, UV_VS, LEAF_FS, { side: THREE.DoubleSide }),
  petal: shaderMat({ uBase: U.petalBase, uTip: U.petalTip }, UV_VS, PETAL_FS, { side: THREE.DoubleSide }),
  center: shaderMat({ uCenter: U.center, uRing: U.petalBase }, UV_VS, CENTER_FS),
};

// ───────────────────────── sound (all synthesized)
let ac = null, master = null, sfxBus = null, muted = false, windGain = null, windFilter = null;
function windSound(t) {
  if (!windGain) return;
  // silent between gusts; each gust is a soft, low swell
  const g = Math.min(1, wind.gustAt(t, 0)) * wind.now;
  windGain.gain.setTargetAtTime(0.022 * g * g, ac.currentTime, 0.5);
  windFilter.frequency.setTargetAtTime(160 + 240 * g, ac.currentTime, 0.5);
}
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
  master.connect(comp).connect(ac.destination);
  // little echo: delay with lowpass feedback
  sfxBus = ac.createGain(); sfxBus.connect(master);
  const delay = ac.createDelay(1), lp = ac.createBiquadFilter(), fb = ac.createGain(), wet = ac.createGain();
  delay.delayTime.value = 0.21; lp.type = 'lowpass'; lp.frequency.value = 2200; fb.gain.value = 0.32; wet.gain.value = 0.28;
  sfxBus.connect(delay); delay.connect(lp).connect(fb).connect(delay); delay.connect(wet).connect(master);
  // wind: looping brown noise through a lowpass; gain + cutoff follow the gusts (see windSound)
  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; ch[i] = last * 3.5; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  windFilter = ac.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 300; windFilter.Q.value = 0.6;
  windGain = ac.createGain(); windGain.gain.value = 0;
  src.connect(windFilter).connect(windGain).connect(master); src.start();
}
function envelope(g, t0, vol, attack, dur) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tone({ type = 'sine', f0, f1 = f0, dur = 0.15, vol = 0.1, delay = 0, attack = 0.004, vib = 0, vibHz = 0, at, out = sfxBus }) {
  const t0 = at ?? ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  if (vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = vibHz; lg.gain.value = vib; l.connect(lg).connect(o.frequency); l.start(t0); l.stop(t0 + dur + 0.05); }
  envelope(g, t0, vol, attack, dur);
  o.connect(g).connect(out);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const lastSfx = {};
function canPlay(name, gap) {
  if (!ac || muted || ac.state !== 'running') return false;
  const now = ac.currentTime;
  if ((lastSfx[name] ?? -1) > now - gap) return false;
  lastSfx[name] = now; return true;
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
const sfx = {
  pop() { if (!canPlay('pop', 0.05)) return; const f = PENTA[Math.floor(Math.random() * PENTA.length)];
    tone({ f0: f * 0.6, f1: f, dur: 0.11, vol: 0.07 }); tone({ type: 'triangle', f0: f * 2, dur: 0.06, vol: 0.018, delay: 0.025 }); },
  leaf() { if (!canPlay('leaf', 0.04)) return; tone({ f0: 1500 + Math.random() * 500, f1: 2300, dur: 0.035, vol: 0.013 }); },
  sprout() { if (!canPlay('sprout', 0.08)) return; tone({ f0: 150, f1: 320 + Math.random() * 90, dur: 0.3, vol: 0.045, attack: 0.02 }); },
  bloom() { if (!canPlay('bloom', 0.07)) return; tone({ f0: 330, f1: 560, dur: 0.2, vol: 0.03, vib: 16, vibHz: 13 }); },
  fresh() { if (!canPlay('fresh', 0.1)) return; tone({ f0: 659.25, dur: 0.3, vol: 0.04 }); tone({ f0: 987.77, dur: 0.38, vol: 0.035, delay: 0.08 }); },
  sink() { if (!canPlay('sink', 0.1)) return; tone({ f0: 420, f1: 170, dur: 0.2, vol: 0.035 }); },
  land() { if (!canPlay('land', 0.1)) return; tone({ f0: 520, f1: 380, dur: 0.08, vol: 0.02 }); },
  shoo() { if (!canPlay('shoo', 0.1)) return; tone({ type: 'triangle', f0: 260, f1: 620, dur: 0.22, vol: 0.03, vib: 30, vibHz: 22 }); },
  drip() { if (!canPlay('drip', 0.07)) return; tone({ f0: 1700 + Math.random() * 900, f1: 1300, dur: 0.04, vol: 0.006 }); },
  floret(h) { if (!canPlay('floret', 0.04)) return; tone({ f0: 620 + h * 900, f1: 900 + h * 1100, dur: 0.05, vol: 0.022 }); },
  tap() { if (!canPlay('tap', 0.06)) return; tone({ type: 'triangle', f0: 900 + Math.random() * 300, f1: 600, dur: 0.05, vol: 0.025 }); },
  poof(k = 1) { if (!canPlay('poof', 0.08)) return; tone({ f0: 210, f1: 470 + 120 * k, dur: 0.1, vol: 0.022 + 0.018 * k, attack: 0.012 });
    tone({ type: 'triangle', f0: 1500, f1: 950, dur: 0.05, vol: 0.007, delay: 0.035 }); },
  grab() { if (!canPlay('grab', 0.05)) return; tone({ f0: 280, f1: 420, dur: 0.12, vol: 0.045, vib: 20, vibHz: 16 }); },
  boing(k) { if (!canPlay('boing', 0.05)) return; // k: 0..1 how far it was bent
    tone({ f0: 160, f1: 260 + 260 * k, dur: 0.25 + 0.25 * k, vol: 0.03 + 0.04 * k, vib: 10 + 40 * k, vibHz: 11 }); },
};

// ───────────────────────── ambience: a little outdoor soundscape, all synthesized blips like everything else.
// Birds call from left and right (now and then another answers), crickets tick in clusters, and frogs
// croak through and after a shower; birds hush while it rains. All quiet, all through the echo.
const AMBIENCE = {
  birds: [2.5, 8],        // seconds between bird calls
  answer: 0.35,           // chance another bird replies from the other side
  crickets: [6, 16],      // seconds between cricket bursts
  frogs: [2, 6],          // seconds between croaks while it's wet
};
const amb = { bird: 2, cricket: 6, frog: 3 };
function ambOut(pan) {   // a stereo spot for one call, into the echo bus; let go of it once the call is over
  const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(sfxBus);
  setTimeout(() => p.disconnect(), 4000);
  return p;
}
const BIRD_CALLS = [
  (at, out, k) => {   // tweet tweet: a few rising sweeps
    const f = 2400 + Math.random() * 800, n = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) tone({ f0: f, f1: f * 1.35, dur: 0.07, vol: 0.02 * k, at: at + i * 0.11, out });
  },
  (at, out, k) => {   // a quick trill
    const f = 2900 + Math.random() * 700;
    for (let i = 0; i < 10; i++) tone({ f0: i % 2 ? f : f * 1.12, dur: 0.03, vol: 0.012 * k, at: at + i * 0.035, out });
  },
  (at, out, k) => {   // a whistle up, and back down
    const f = 1600 + Math.random() * 400;
    tone({ f0: f, f1: f * 1.55, dur: 0.22, vol: 0.017 * k, at, out });
    tone({ f0: f * 1.5, f1: f * 1.15, dur: 0.26, vol: 0.015 * k, at: at + 0.3, out });
  },
  (at, out, k) => {   // a soft dove, far off
    tone({ f0: 620, f1: 600, dur: 0.35, vol: 0.011 * k, vib: 6, vibHz: 7, at, attack: 0.05, out });
    tone({ f0: 520, f1: 500, dur: 0.45, vol: 0.009 * k, vib: 6, vibHz: 7, at: at + 0.45, attack: 0.05, out });
  },
  (at, out, k) => {   // chick-a-dee: high, low, low
    tone({ f0: 3300, f1: 3200, dur: 0.12, vol: 0.016 * k, at, out });
    tone({ f0: 2600, dur: 0.1, vol: 0.013 * k, at: at + 0.19, out });
    tone({ f0: 2600, dur: 0.1, vol: 0.013 * k, at: at + 0.33, out });
  },
];
function ambience(dt) {
  if (!ac || ac.state !== 'running' || muted || params.ambience <= 0) return;
  const k = params.ambience, now = ac.currentTime, wet = Math.max(rain.level, rain.wet);
  if ((amb.bird -= dt * (1 - 0.85 * rain.level)) <= 0) {   // birds hush in the rain
    amb.bird = R(Math.random, ...AMBIENCE.birds);
    const call = BIRD_CALLS[Math.floor(Math.random() * BIRD_CALLS.length)], pan = (Math.random() * 2 - 1) * 0.8;
    call(now + 0.05, ambOut(pan), k);
    if (Math.random() < AMBIENCE.answer) call(now + 0.9 + Math.random() * 0.7, ambOut(-pan * 0.9), k * 0.7);   // an answer
  }
  if ((amb.cricket -= dt) <= 0) {   // crickets: little clusters of tiny ticks
    amb.cricket = R(Math.random, ...AMBIENCE.crickets);
    const out = ambOut((Math.random() * 2 - 1) * 0.6), f = 4400 + Math.random() * 600, groups = 3 + Math.floor(Math.random() * 4);
    for (let g = 0; g < groups; g++) for (let i = 0; i < 3; i++) tone({ f0: f, dur: 0.014, vol: 0.006 * k, at: now + g * 0.38 + i * 0.045, attack: 0.002, out });
  }
  if (wet > 0.2 && (amb.frog -= dt) <= 0) {   // frogs: a wobbly ribbit, through and after a shower
    amb.frog = R(Math.random, ...AMBIENCE.frogs);
    const out = ambOut((Math.random() * 2 - 1) * 0.7), f = 150 + Math.random() * 60;
    tone({ type: 'triangle', f0: f, f1: f * 0.75, dur: 0.14, vol: 0.03 * k, vib: 25, vibHz: 32, at: now, out });
    tone({ type: 'triangle', f0: f * 1.1, f1: f * 0.8, dur: 0.18, vol: 0.026 * k, vib: 25, vibHz: 32, at: now + 0.2, out });
  }

// ───────────────────────── particles: flat camera-facing squares that rise, drift, shrink, fade
const particles = (() => {

          v: vel ? vel.clone().multiplyScalar(0.8 + Math.random() * 0.4).add(new V3(0, up * Math.random(), 0))

          drag,

// ───────────────────────── geometry helpers
// a flat sheet along +Z (u = 0..1 base→tip, v = -1..1 across), front face = +Y.
// round: profile(1) is the width where the body ends; a semicircle of that radius closes the tip
function sheetGeo({ L, W, profile, round = false, cupV = 0, cupU = 0, droop = 0, fold = 0, segU = 12, segV = 6 }) {
  const pos = [], uv = [], idx = [], row = segV + 1;
  const uT = round ? 1 - Math.min(0.45, profile(1) * W / L) : 1;
  const width = (u) => {
    if (u <= uT) return Math.max(0, profile(u / uT)) * W;
    const k = (u - uT) / (1 - uT);
    return profile(1) * W * Math.sqrt(Math.max(0, 1 - k * k));
  };
  for (let j = 0; j <= segU; j++) {
    const u = round ? 1 - (1 - j / segU) ** 1.6 : j / segU, w = width(u); // denser rows toward a rounded tip
    for (let i = 0; i <= segV; i++) {
      const v = i / segV * 2 - 1;
      pos.push(v * w, cupV * v * v * w + (cupU - droop) * u * u * L + fold * Math.abs(v) * w, u * L);
      uv.push(u, v);
    }
  }
  for (let j = 0; j < segU; j++) for (let i = 0; i < segV; i++) {
    const a = j * row + i, b = a + 1, d = a + row, c = d + 1;
    idx.push(a, d, b, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const PETAL = (u) => (0.2 + 0.8 * Math.sin(Math.PI * 0.5 * Math.min(u / 0.7, 1))) * Math.sqrt(Math.max(0, 1 - u ** 6));
// sepal body ends at a nonzero width; sheetGeo rounds it off (leaflet profiles are built per species)
const SEPAL = (u) => (u < 0.45 ? Math.sin(Math.PI * 0.5 * u / 0.45) ** 0.6 : lerp(1, 0.55, smooth(0.45, 1, u)));

function domeGeo(rim, h) {
  const th = 0.75, Rs = rim / Math.sin(th);
  const g = new THREE.SphereGeometry(Rs, 32, 6, 0, TAU, 0, th);
  const p = g.attributes.position, uv = g.attributes.uv, top = Rs * (1 - Math.cos(th));
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, (p.getY(i) - Rs * Math.cos(th)) * h / top);
    uv.setXY(i, x / rim, z / rim);
  }
  return g;
}

// point an object's +Z along d with +Y leaning toward upHint
const _m4 = new THREE.Matrix4();
function orient(obj, d, upHint = UP) {
  const z = d.clone().normalize();
  const y = upHint.clone().addScaledVector(z, -upHint.dot(z)).normalize();
  obj.quaternion.setFromRotationMatrix(_m4.makeBasis(new V3().crossVectors(y, z), y, z));

// a tube whose vertices are rewritten every frame from a chain of points (parallel-transport frames)
const RING_COS = [], RING_SIN = [];
for (let k = 0; k < STEM_SIDES; k++) { RING_COS.push(Math.cos(k / STEM_SIDES * TAU)); RING_SIN.push(Math.sin(k / STEM_SIDES * TAU)); }
class Tube {
  constructor(rings, sides) {
    this.rings = rings; this.sides = sides;
    const vc = rings * sides, g = this.geo = new THREE.BufferGeometry();
    this.pos = new THREE.BufferAttribute(new Float32Array(vc * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.nor = new THREE.BufferAttribute(new Float32Array(vc * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.t = new THREE.BufferAttribute(new Float32Array(vc), 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.pos); g.setAttribute('normal', this.nor); g.setAttribute('aT', this.t);
    const idx = [];
    for (let i = 0; i < rings - 1; i++) for (let k = 0; k < sides; k++) {
      const a = i * sides + k, b = i * sides + (k + 1) % sides, c = b + sides, d = a + sides;
      idx.push(a, b, d, b, c, d);
    }
    g.setIndex(idx);

    const t0 = tans[0];

    for (let i = 0; i < this.rings; i++) {
      const t = tans[i], p = pts[i], r = radii[i];
      N.addScaledVector(t, -N.dot(t));
      if (N.lengthSq() < 1e-10) N.set(t.y, -t.x, 0);
      N.normalize();
      B.crossVectors(t, N);

        const o = (i * s + k) * 3;
        P[o] = p.x + nx * r; P[o + 1] = p.y + ny * r; P[o + 2] = p.z + nz * r;
        Nn[o] = nx; Nn[o + 1] = ny; Nn[o + 2] = nz;

// ───────────────────────── plant parts
class Flower {
  constructor(plant, rng, size, bloom, count) {
    this.group = new THREE.Group();
    this.b = 0; this.bv = 0; this.target = 0; this.finalBloom = bloom; this.opened = false;
    this.openPitch = SP.petalOpen;
    const L = this.L = SP.petalLen * size, SL = 0.2 * size * SP.sepalLen;
    const petalGeo = plant.keep(sheetGeo({ L, W: L * SP.petalW, profile: PETAL, cupV: 0.35, cupU: SP.petalCup, segU: 20, segV: 10 }));
    const sepalGeo = plant.keep(sheetGeo({ L: SL, W: 0.2 * size * 0.26, profile: SEPAL, round: true, cupV: 0.55, cupU: 0.4, segU: 12, segV: 6 }));
    const rec = new THREE.Mesh(plant.keep(new THREE.SphereGeometry(0.2 * size * 0.16, 12, 8)), MAT.receptacle);
    rec.scale.y = 0.8;
    this.group.add(rec);
    this.petals = []; this.sepals = [];
    const spin = rng() * TAU;
    for (let k = 0; k < count; k++) {
      const az = spin + k / count * TAU + (rng() - 0.5) * 0.15, o = 0.2 * size * 0.06;
      const ph = new THREE.Group();
      ph.rotation.y = az; ph.position.set(Math.sin(az) * o, o * 0.8, Math.cos(az) * o);
      const pm = new THREE.Mesh(petalGeo, MAT.petal);
      pm.userData.s = 1 + (rng() - 0.5) * 0.12;
      pm.userData.shape = { L, W: L * SP.petalW, cupV: 0.35, cupU: SP.petalCup };   // (dew sits on it)
      ph.add(pm); this.group.add(ph); this.petals.push(pm);

      const saz = az + TAU / count / 2, so = 0.2 * size * 0.1;
      const sh = new THREE.Group();
      sh.rotation.y = saz; sh.position.set(Math.sin(saz) * so, 0, Math.cos(saz) * so);
      const sm = new THREE.Mesh(sepalGeo, MAT.leaf);
      sh.add(sm); this.group.add(sh); this.sepals.push(sm);
    }
    const C = 0.2 * size;
    this.center = new THREE.Mesh(plant.keep(domeGeo(C * SP.centerR, C * SP.centerH)), MAT.center);
    this.center.position.y = C * 0.06;
    this.perch = C * (0.06 + SP.centerH);   // top of the centre dome, where a visitor sits
    this.group.add(this.center);
    this.group.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    this.setBloom(0);
  }
  // 0 = tight green bud, ~0.5 = cupped, 1 = wide open (overshoot allowed: springs past and back)
  setBloom(b) {
    const pitch = lerp(1.42, this.openPitch, b), ps = lerp(0.45, 1, smooth(0, 1, b * 1.3));
    for (const pm of this.petals) { pm.rotation.x = -pitch; pm.scale.setScalar(Math.max(1e-4, pm.userData.s * ps * (pm.userData.grow ?? 1))); }   // grow: < 1 while regrowing a fallen petal
    const sp = lerp(1.3, -0.5, clamp01(b * 1.5));
    for (const sm of this.sepals) sm.rotation.x = -sp;
    this.center.scale.setScalar(Math.max(1e-4, smooth(0.2, 0.75, b)));
  }
  bloomTo(v) { this.opened = true; this.target = v; this.finalBloom = v; }
  update(dt, popX) {
    if (!this.opened && popX > 0.65) { this.opened = true; this.target = this.finalBloom; }
    const goal = this.opened ? this.target * (1 - 0.4 * rain.level) : this.target;   // half-close in the rain
    this.bv += (goal - this.b) * BLOOM_K * dt;
    this.bv *= Math.exp(-BLOOM_D * dt);
    this.b += this.bv * dt;
    this.setBloom(this.b);
  }
}

function makeLeaflet(plant, rng, L, droop) {
  const W = L * R(rng, SP.leafW[0], SP.leafW[1]), tip = SP.leafRound;
  const profile = (u) => (u < 0.45 ? Math.sin(Math.PI * 0.5 * u / 0.45) ** 0.6 : lerp(1, tip, smooth(0.45, 1, u)));
  const m = new THREE.Mesh(plant.keep(sheetGeo({ L, W, profile, round: true, fold: 0.3, droop, segU: 22, segV: 6 })), MAT.leaf);
  m.castShadow = true;
  m.userData.leaf = { L, W, droop, width: (u) => W * Math.max(0, profile(u)) };   // walkers use its shape
  return m;
}
const R = (rng, a, b) => a + (b - a) * rng();

// two or three leaflets fanning out up one side of a stem node (tangent frame: +Y = stem direction)
function makeBract(plant, rng, scale = 1) {
  const g = new THREE.Group();
  const n = rng() < 0.35 ? 3 : 2, az0 = rng() * TAU, gap = R(rng, 0.85, 1.15);
  for (let i = 0; i < n; i++) {

    const d = new V3(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
    const L = R(rng, 0.13, 0.26) * scale * SP.leafScale;
    const leaf = makeLeaflet(plant, rng, L, R(rng, 0.05, 0.25));
    orient(leaf, d, UP);
    g.add(leaf);
  }
  return g;
}

// a hand of 3 (sometimes 5) leaflets fanned evenly so they don't pile up (world frame)
function makePalmate(plant, rng, h, scale = 1) {
  const g = new THREE.Group(), n = rng() < 0.35 ? 5 : 3, step = R(rng, 0.5, 0.65) * (n === 5 ? 0.85 : 1);
  for (let i = 0; i < n; i++) {

    const d = h.clone().applyAxisAngle(UP, side * step + R(rng, -0.06, 0.06)).multiplyScalar(Math.cos(el)).addScaledVector(UP, Math.sin(el));
    const L = R(rng, 0.17, 0.25) * scale * SP.leafScale * (1.1 - 0.12 * Math.abs(side));
    const leaf = makeLeaflet(plant, rng, L, R(rng, 0.15, 0.35));
    orient(leaf, d, UP);
    g.add(leaf);
  }
  return g;

// round end caps for stems (aT baked so they match the gradient at that end)

addEventListener('pointermove', (e) => {
  if (!grab) { if (!hold && e.target === canvas && !e.buttons) canvas.style.cursor = pickCritter(e) || pickCrawler(e) ? 'pointer' : pick(e) ? 'grab' : ''; return; }
  if (e.pointerId !== grab.id) return;
  if (!grab.moved && Math.hypot(e.clientX - grab.x0, e.clientY - grab.y0) > CLICK_SLOP) { grab.moved = true; sfx.grab(); }
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const p = raycaster.ray.intersectPlane(grab.plane, new V3());
  if (!p) return;
  const { stem, f } = grab, w = f * f;
  // horizontal offset that would put the grabbed point under the pointer, as a tip offset
  const d = p.sub(grab.lift).sub(stem.restAt(f, new V3())).sub(stem.baseDisp);
  const goal = new THREE.Vector2(d.x / w, d.z / w), m = goal.length(), max = GRAB_MAX * stem.len;
  if (m > 1e-6) goal.multiplyScalar(max * Math.tanh(m / max) / m);
  stem.held.goal.copy(goal);
});
function touchCritter(c) {   // poke a crawler, shoo a flyer
  if (c.poke) c.poke();
  else c.shoo(camera.getWorldDirection(new V3()).setY(0).normalize());
}
function release() {
  if (!grab) return;
  const { stem, flower } = grab, k = clamp01(stem.off.length() / (GRAB_MAX * stem.len));
  stem.held = null;
  if (!grab.moved && performance.now() - grab.t0 < 400) {   // a click, not a drag
    if (grab.nearby) touchCritter(grab.nearby);
    else if (flower) toggleBloom(flower, stem);
    canvas.style.cursor = ''; grab = null;
    return;
  }
  sfx.boing(k);
  if (flower && k > 0.25 && flower.b > 0.4) poof(stem.at(1, new V3()).add(new V3(0, 0.01, 0)), 0.4 + 0.8 * k);   // shaken: out puffs the pollen
  canvas.style.cursor = '';
  grab = null;
}
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, (e) => { if (grab && e.pointerId === grab.id) release(); });
const CLICK_SLOP = 6;   // px a press may wander and still count as a click
function toggleBloom(flower, stem) {   // a bud (or half-open flower) opens; an open flower closes back to a bud
  const opening = flower.target < 0.75;
  flower.bloomTo(opening ? 1 : 0);
  stem.kick(0.04);
  const at = stem.at(1, new V3());
  at.y += 0.01;
  if (opening) { sfx.bloom(); poof(at, 0.6); }
  else { sfx.sink(); if (flower.b > 0.4) poof(at, 0.9); }   // closing squeezes out a puff
}

// ───────────────────────── macro focus: zoom right in and it behaves like a macro lens. The nearest stems in the middle
// of the view stay sharp and everything further back goes gradually soft. Only what's *behind* the focus blurs, so nothing
// near smears over the sharp stems. At normal zoom it's off (and costs nothing).
const DOF = {
  near: 0.7, far: 1.9,    // camera distance (to what it orbits) where the effect is full / starts to fade in
  blur: 9,                // softest blur radius, in CSS pixels
  range: 0.45,            // how far past the focus (as a fraction of the focus distance) until fully soft
};
const dofRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4, depthTexture: new THREE.DepthTexture(1, 1) });
dofRT.texture.colorSpace = THREE.SRGBColorSpace;   // so built-in materials write exactly what they'd write to the screen
const dofMat = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: dofRT.texture }, tDepth: { value: dofRT.depthTexture }, uNear: { value: 0 }, uFar: { value: 1 },
    uFocus: { value: 1 }, uRange: { value: DOF.range }, uBlur: { value: 0 }, uRes: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `#include <packing>
uniform sampler2D tColor; uniform sampler2D tDepth; uniform float uNear, uFar, uFocus, uRange, uBlur; uniform vec2 uRes; varying vec2 vUv;
float coc(vec2 uv) {   // 0 = in focus (or nearer), 1 = as soft as it gets
  float z = -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar);
  return clamp((z - uFocus) / (uFocus * uRange), 0.0, 1.0);
}
void main() {
  vec4 base = texture2D(tColor, vUv);
  float c0 = coc(vUv), R = c0 * uBlur;
  if (R < 0.5) { gl_FragColor = base; return; }
  vec3 acc = base.rgb; float wsum = 1.0;
  for (int i = 0; i < 24; i++) {   // a golden-angle disc of taps
    float fi = float(i) + 0.5, r = sqrt(fi / 24.0), a = fi * 2.39996323;
    vec2 uv = vUv + vec2(cos(a), sin(a)) * r * R / uRes;
    // a tap only counts if its own blur reaches back here: keeps sharp stems from bleeding into the soft background
    float w = clamp(coc(uv) * uBlur - r * R + 1.0, 0.0, 1.0);
    acc += texture2D(tColor, uv).rgb * w; wsum += w;
  }
  gl_FragColor = vec4(acc / wsum, 1.0);
}`,
  depthTest: false, depthWrite: false,
});
const dofScene = new THREE.Scene(), dofCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const dofQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), dofMat);
dofQuad.frustumCulled = false; dofScene.add(dofQuad);
let dofFocus = 1;
const _df = new V3();
function render(dt) {
  const s = params.dof ? DOF.force ?? smooth(DOF.far, DOF.near, camera.position.distanceTo(controls.target)) : 0;
  if (s < 0.01 || !current) { renderer.render(scene, camera); return; }
  // focus on the nearest bit of stem in the middle of the view
  camera.updateMatrixWorld();
  let near = Infinity;
  for (const st of current.stems) {
    if (!st.mesh.visible) continue;
    for (const p of st.pts) {
      _df.copy(p).applyMatrix4(camera.matrixWorldInverse);
      const z = -_df.z;
      if (z < camera.near || z >= near) continue;
      _df.copy(p).project(camera);
      if (Math.abs(_df.x) < 0.6 && Math.abs(_df.y) < 0.6) near = z;
    }
  }
  for (const w of webs) {   // so does a web you're looking at
    if (!w.lines.visible || w.vis < 0.3) continue;
    _df.copy(w.c).applyMatrix4(camera.matrixWorldInverse);
    const z = -_df.z;
    if (z < camera.near || z >= near) continue;
    _df.copy(w.c).project(camera);
    if (Math.abs(_df.x) < 0.6 && Math.abs(_df.y) < 0.6) near = z;
  }
  if (!isFinite(near)) near = camera.position.distanceTo(controls.target);
  dofFocus = lerp(dofFocus, near, 1 - Math.exp(-6 * dt));
  const u = dofMat.uniforms;
  u.uNear.value = camera.near; u.uFar.value = camera.far; u.uFocus.value = dofFocus; u.uRange.value = DOF.range;
  u.uBlur.value = DOF.blur * s * renderer.getPixelRatio();
  renderer.setRenderTarget(dofRT); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(dofScene, dofCam);
}

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  particles.uScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  renderer.getDrawingBufferSize(DROP_U.uRes.value);
  DROP_U.uPx.value = RAIN.px * renderer.getPixelRatio();
  dofRT.setSize(DROP_U.uRes.value.x, DROP_U.uRes.value.y); dofMat.uniforms.uRes.value.copy(DROP_U.uRes.value);
}
addEventListener('resize', resize);
resize();

// ───────────────────────── go
regen(params.seed);
syncCritters();
window.plantDebug = { get plant() { return current; }, regen, params, camera, controls, camTarget, critters, worms, bugs, flies, spiders, wind, rain, fallen, dropNow: () => dropOne(time), get dews() { return dews; }, fallingDrops, get ants() { return ants; }, get webs() { return webs; }, poof, DOF };

const clock = new THREE.Clock();
let time = 0;
let loopErrors = 0;
renderer.setAnimationLoop(() => {
  try { frame(); } catch (err) {   // one bad frame must never stop the whole loop (three.js won't schedule the next one)
    if (loopErrors++ < 3) console.error(err);
  }
});
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  if (dt <= 0) return;
  time += dt;
  wind.update(dt, time);
  windSound(time);
  windSpecks(dt, time);
  updateCritters(dt, time);
  updateCrawlers(dt, time);
  updateFalling(dt, time);
  healBites(dt, time);
  updateDew(dt, time);
  updateAnts(dt, time);
  updateWebs(dt);
  updateHairs();
  updateRain(dt, time);
  ambience(dt);
  critterSounds(dt, time);
  for (const p of plants) p.update(dt, time);
  plants = plants.filter((p) => !p.dead);
  particles.update(dt);
  poofs.update(dt);
  updateCamera(dt);
  // keep the plant centred: slide target (and camera with it) toward the plant's middle
  if (follow) {
    const step = camTarget.clone().sub(controls.target).multiplyScalar(1 - Math.exp(-4 * dt));
    controls.target.add(step); camera.position.add(step);
  }
  if (fitDist > 0) {
    const off = camera.position.clone().sub(controls.target), d = off.length();
    camera.position.copy(controls.target).addScaledVector(off, lerp(d, fitDist, 1 - Math.exp(-3 * dt)) / d);
    if (Math.abs(d - fitDist) < 0.01) fitDist = 0;
  }
  // orbit as low as you like, until the camera would touch the ground: the lowest angle depends on how high the target is
  controls.target.y = Math.max(controls.target.y, CAM_MIN_Y);
  const camD = camera.position.distanceTo(controls.target);
  controls.maxPolarAngle = Math.min(Math.PI - 0.05, Math.acos(clamp((CAM_MIN_Y - controls.target.y) / camD, -1, 1)));
  if (camera.position.y < CAM_MIN_Y) camera.position.y = CAM_MIN_Y;
  controls.update();
  render(dt);
}
</script>
